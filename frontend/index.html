<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plumbline · Bonded public promises on GenLayer</title>
    <meta
      name="description"
      content="Plumbline locks a bond behind a web page and the sentences it must keep saying. Validators re-read the page; if it stops standing behind its promises, the bond is slashed."
    />
    <meta name="theme-color" content="#f5f1e8" />
    <meta property="og:title" content="Plumbline · Bonded public promises" />
    <meta
      property="og:description"
      content="A bond behind every promise. Validators on GenLayer check that the page still says what it said."
    />
    <meta property="og:image" content="/brand/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/brand/plumbline-mark.svg" />
    <link rel="apple-touch-icon" href="/mochi/mochi-avatar.png" />
    <script>
      // Set the theme before first paint so there is no flash.
      (function () {
        try {
          var saved = localStorage.getItem('plumbline.theme');
          var dim = saved ? saved === 'dim' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dim ? 'dim' : 'light');
        } catch (e) {}
      })();
    </script>
    <script>
      // Boot watchdog. A failed request for the stylesheet or the app script fires "error" on its element (it does not
      // bubble, hence capture). On a flaky connection the first try often fails while the next one works, so the
      // failed file is requested again (up to 3 times, with a new URL so nothing cached or half-failed is reused)
      // before giving up and naming the file on screen.
      (function () {
        var failed = [];
        var tries = {};
        function show() {
          var f = document.getElementById('boot-fail');
          if (!f) return;
          f.hidden = false;
          var why = document.getElementById('boot-why');
          if (why && failed.length) why.textContent = 'Could not download: ' + failed.slice(0, 3).join(', ');
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (!t || !t.tagName) return;
            var isScript = t.tagName === 'SCRIPT' && t.type === 'module';
            var isCss = t.tagName === 'LINK' && t.rel === 'stylesheet';
            if (!isScript && !isCss) return;
            var key = (t.src || t.href || '').replace(/[?&]r=\d+$/, '');
            var n = (tries[key] = (tries[key] || 0) + 1);
            if (n <= 3) {
              setTimeout(function () {
                var c = document.createElement(isScript ? 'script' : 'link');
                if (isScript) {
                  c.type = 'module';
                  c.src = key + '?r=' + n;
                } else {
                  c.rel = 'stylesheet';
                  c.href = key + '?r=' + n;
                }
                if (t.crossOrigin !== null) c.crossOrigin = t.crossOrigin;
                document.head.appendChild(c);
              }, 800 * n);
              return;
            }
            failed.push(key.replace(location.origin, ''));
            show();
          },
          true,
        );
        setTimeout(show, 10000);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot" style="min-height:100vh;display:grid;place-items:center;font:600 14px system-ui,sans-serif;color:#6b6556;text-align:center">
        <div>
          <p>Loading Plumbline…</p>
          <div id="boot-fail" hidden style="margin-top:12px">
            <p>
              This is taking longer than it should.
              <button onclick="location.reload()" style="margin-left:6px;padding:6px 14px;border-radius:8px;border:1px solid #b9b3a2;background:transparent;color:inherit;font:inherit;cursor:pointer">Reload</button>
            </p>
            <p id="boot-why" style="margin-top:10px;font:12px ui-monospace,monospace;opacity:.8;word-break:break-all"></p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
