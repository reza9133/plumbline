<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plumbline · Bonded public promises on GenLayer</title>
    <meta
      name="description"
      content="Plumbline locks a bond behind a web page and the sentences it must keep saying. Validators re-read the page; if it stops standing behind its promises, the bond is slashed."
    />
    <meta name="theme-color" content="#f5f1e8" />
    <meta property="og:title" content="Plumbline · Bonded public promises" />
    <meta
      property="og:description"
      content="A bond behind every promise. Validators on GenLayer check that the page still says what it said."
    />
    <meta property="og:image" content="/brand/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/brand/plumbline-mark.svg" />
    <link rel="apple-touch-icon" href="/mochi/mochi-avatar.png" />
    <script>
      // Set the theme before first paint so there is no flash.
      (function () {
        try {
          var saved = localStorage.getItem('plumbline.theme');
          var dim = saved ? saved === 'dim' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dim ? 'dim' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot" style="min-height:100vh;display:grid;place-items:center;font:600 14px system-ui,sans-serif;color:#6b6556;text-align:center">
        <div>
          <p>Loading Plumbline…</p>
          <p id="boot-fail" hidden style="margin-top:12px">
            This is taking longer than it should.
            <button onclick="location.reload()" style="margin-left:6px;padding:6px 14px;border-radius:8px;border:1px solid #b9b3a2;background:transparent;color:inherit;font:inherit;cursor:pointer">Reload</button>
          </p>
        </div>
      </div>
    </div>
    <script>
      // If the app has not replaced the loading text after 10 seconds (a script failed to download), offer a reload.
      setTimeout(function () {
        var f = document.getElementById('boot-fail');
        if (f) f.hidden = false;
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
